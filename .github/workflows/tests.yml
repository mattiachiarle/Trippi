name: Tests

# Build and run the test suite on every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:

# If you push again before a run finishes, cancel the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # The project targets iOS 26, so we need an Xcode that ships that SDK.
      # Select the newest Xcode installed on the runner and show what we got.
      - name: Select newest Xcode
        run: |
          echo "Installed Xcodes:"
          ls -d /Applications/Xcode*.app || true
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          echo "Available iPhone simulators:"
          xcrun simctl list devices available | grep -i iphone || echo "(none)"

      - name: Run tests
        run: |
          # Pick the first available iPhone simulator by UDID (no name guessing).
          UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-F-]{36}')
          echo "Testing on simulator: $UDID"
          xcodebuild test \
            -scheme Trippi \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
