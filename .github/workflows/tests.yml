name: Tests

# Build and run the test suite on every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:

# If you push again before a run finishes, cancel the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # The project targets iOS 26, but the runner's DEFAULT Xcode is 16.x,
      # which lacks that SDK. Select the newest installed Xcode (26.x).
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Build and test
        run: |
          # Resolve the first available iPhone simulator by NAME (per GitHub's
          # official iOS starter workflow). xctrace prints to stderr, hence 2>&1.
          device=$(xcrun xctrace list devices 2>&1 \
            | grep -oE 'iPhone.*?[^\(]+' | head -1 \
            | awk '{$1=$1;print}' | sed -e "s/ Simulator$//")
          echo "Using simulator: $device"
          xcodebuild test \
            -project Trippi.xcodeproj \
            -scheme Trippi \
            -destination "platform=iOS Simulator,name=$device" \
            CODE_SIGNING_ALLOWED=NO
