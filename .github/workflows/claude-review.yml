name: Claude Auto Review

# Runs Claude on every pull request to leave review feedback as PR comments.
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read            # read the repo
      pull-requests: write      # post review comments
      id-token: write           # OIDC, required by the action
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Uses your Claude subscription via a token from `claude setup-token`,
          # stored as the repo secret CLAUDE_CODE_OAUTH_TOKEN.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is a SwiftUI + SwiftData learning project (the author is new to
            Swift). Review this pull request with a focus on:
            - Swift / SwiftUI / SwiftData correctness and idiomatic style
            - Potential bugs or runtime issues
            - Simplicity — flag anything overcomplicated for what it does
            - Clear, teaching-oriented explanations (the author is learning)

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
